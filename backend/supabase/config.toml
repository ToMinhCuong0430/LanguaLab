# Cấu hình dự án Supabase CLI cho Langua
project_id = "langua-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.speaking-recordings]
public = false
file_size_limit = "25MiB"
allowed_mime_types = ["audio/webm", "audio/mp4", "audio/ogg", "audio/wav", "audio/mpeg"]

[storage.buckets.avatars]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/svg+xml"]

[functions.delete-account]
enabled = true
verify_jwt = false
import_map = "./functions/delete-account/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/delete-account/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/delete-account/*.html" ]

[functions.ai-score]
enabled = true
# JWT được kiểm tra bên trong function (giống delete-account) để trả lỗi tiếng Việt rõ ràng
verify_jwt = false
import_map = "./functions/ai-score/deno.json"
entrypoint = "./functions/ai-score/index.ts"
